<!DOCTYPE html>
<html>
<head>
    <title>Favicon Generator</title>
    <style>
        canvas { border: 1px solid #ccc; }
        body { font-family: Arial, sans-serif; padding: 20px; }
    </style>
</head>
<body>
    <h2>Gen-Plasma Favicon Generator</h2>
    <canvas id="canvas" width="32" height="32"></canvas>
    <br><br>
    <button onclick="generateFavicon()">Generate Favicon</button>
    <br><br>
    <div id="output"></div>

    <script>
        function generateFavicon() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            
            // Clear canvas
            ctx.clearRect(0, 0, 32, 32);
            
            // Set background (transparent)
            ctx.fillStyle = 'transparent';
            ctx.fillRect(0, 0, 32, 32);
            
            // Draw a simple mathematical symbol (like a plasma wave)
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            // Draw a stylized wave/plasma pattern
            for (let x = 0; x < 32; x++) {
                const y = 16 + Math.sin(x * 0.3) * 6 + Math.sin(x * 0.7) * 3;
                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            // Add a second wave
            ctx.strokeStyle = '#ff6b35';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let x = 0; x < 32; x++) {
                const y = 16 + Math.cos(x * 0.4) * 4 + Math.cos(x * 0.8) * 2;
                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            
            // Convert to data URL
            const dataURL = canvas.toDataURL('image/png');
            document.getElementById('output').innerHTML = 
                '<p>Right-click the image below and save as "favicon.ico":</p>' +
                '<img src="' + dataURL + '" style="width: 64px; height: 64px; image-rendering: pixelated;">';
        }
        
        // Generate on page load
        window.onload = generateFavicon;
    </script>
</body>
</html>
